<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive</title>

    <style>
        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
        }

        table {
            width: 100%;
            height: 100%;
            border-collapse: collapse;
            border: 1px solid gray;
        }

        td {
            text-align: center;
            border: 1px solid gray;
        }

        .box1 {
            background-color: pink;
        }

        .box2 {
            background-color: lightblue;
        }
    </style>
</head>

<body>

    <table>
        <tr>
            <td class="box1">Hello</td>
            <td class="box2">World</td>
        </tr>
    </table>

</body>
</html>
