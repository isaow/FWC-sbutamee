<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basics</title>

    <style>
        body {
            background-color: pink;
            margin: 0;
        }

        h1 {
            color: white;
            text-align: center;
        }

        .shops {
            display: flex;
            justify-content: center;
            gap: 40px;
            text-align: center;
        }

        .shop {
            margin-top: 100px;
            width: 300px;
        }

        .shop img {
            width: 300px;
            height: 200px;
            object-fit: contain;
        }

        .shop a {
            display: block;
        }

        hr {
            width: 100%;
            margin-top: 100px;
        }

        footer {
            text-align: right;
            font-family: monospace;
            font-style: italic;
        }
    </style>
</head>

<body>

    <h1>My Online Shops &gt;&lt;</h1>

    <div class="shops">

        <div class="shop">
            <img src="https://static.freepnglogo.com/images/all_img/1727674497_shopee-logo-transparent.png"
                 alt="Shopee">
            <a href="https://shopee.co.th/" target="_blank">
                Shopee
            </a>
        </div>

        <div class="shop">
            <img src="https://1000logos.net/wp-content/uploads/2016/10/Amazon-Logo.png"
                 alt="Amazon">
            <a href="https://www.amazon.com/" target="_blank">
                Amazon
            </a>
        </div>

    </div>

    <hr>

    <footer>
        &copy; sbutamee 2026
    </footer>

</body>
</html>
